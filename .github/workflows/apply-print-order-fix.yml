name: Apply print order fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-print-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update missing print order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          start = text.index('function byCountry(kind)')
          end = text.index('function chunk(a,n)', start)
          replacement = '''function byCountry(kind){if(kind==="missing"){let groups=new Map();STICKERS.filter(s=>(state.inv[s.id]||0)===0).forEach(s=>{let k=s.country||"Otros";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s)});return Array.from(groups,(entry)=>({name:entry[0],items:entry[1]}))}let g={};STICKERS.filter(s=>(state.inv[s.id]||0)>=2).forEach(s=>{let k=s.country||"Otros";(g[k]=g[k]||[]).push(s)});return Object.keys(g).sort().map(name=>({name,items:g[name].sort((a,b)=>localNum(a).localeCompare(localNum(b),undefined,{numeric:true}))}))}'''
          if text[start:end] == replacement:
              print('index.html already updated')
          else:
              path.write_text(text[:start] + replacement + text[end:])
              print('index.html updated')
          PY
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Print missing stickers in album order"
          git push
